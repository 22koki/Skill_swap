services:
  - type: web
    name: skillswap-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Single-instance beta: migrations execute before the server starts.
    # For multi-instance or zero-downtime production, use a paid pre-deploy
    # migration job instead of startup migrations.
    startCommand: sh -c 'python manage.py migrate --noinput && exec daphne -b 0.0.0.0 -p "$PORT" config.asgi:application'
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_TRUST_PROXY
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
